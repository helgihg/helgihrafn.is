apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Values.name }}-https-redirect
  namespace: {{ .Release.Namespace }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Values.name }}-to-www
  namespace: {{ .Release.Namespace }}
spec:
  redirectRegex:
    regex: ^https?://{{ .Values.ingress.host }}/(.*)
    replacement: https://www.{{ .Values.ingress.host }}/${1}
    permanent: true
